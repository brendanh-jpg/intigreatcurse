services:
  sync:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./debug:/app/debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10s
